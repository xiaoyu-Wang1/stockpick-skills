# graham-deep-value 阈值参数 v1.0
weights:
  hard_indicators: 80                   # 七条合计
  value_trap_defence: 20

indicators:                             # 与 andMYhacks/graham 的量化口径对齐，按 A 股调整
  g1_size_market_cap_min: 10000000000   # 100 亿（元）
  g2_debt_to_assets_max: 0.65
  g2_current_ratio_min: 1.5
  g3_years_no_loss: 10
  g4_dividend_years_min: 20
  g4_degraded_years_min: 10             # 不足 20 年数据时的降级判定线
  g5_eps_growth_10y_min_pct: 33         # 累计 ≥1/3
  g6_pe_max: 15
  g7_pe_x_pb_max: 22.5
  g7_pb_max: 1.5

ncav:                                   # 净流动资产（烟蒂）口径
  price_to_ncav_max: 0.66
  exclude_intangibles: true
  require_manual_verify: true           # metrics.py 未提供该值时必须人工复核

severity:                               # 挂哪条 → 什么结论
  valuation_g6_g7: fail
  size_g1: fail
  quality_g2_g3_g4_g5: gray

value_trap:
  structural_decline_veto: true         # 结构性衰退且无催化剂 → fail
  required_questions: [reason_cheap, catalyst, can_stay_cheap]
